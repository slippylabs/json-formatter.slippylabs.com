<body>

<div class="starfield"></div>
<div class="scanlines"></div>

<main class="page-wrap">
  <div class="hud-panel wide">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="callsign-row">
      <div class="toad-avatar-wrap">
        <svg class="toad-avatar" width="46" height="46" viewBox="0 0 64 64">
          <circle cx="32" cy="34" r="22" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="44" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="3.5" fill="#050b10"/>
          <circle cx="44" cy="16" r="3.5" fill="#050b10"/>
          <ellipse cx="24" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>
          <ellipse cx="40" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>
          <circle cx="24" cy="30" r="1.4" fill="#39ff8f"/>
          <circle cx="40" cy="30" r="1.4" fill="#39ff8f"/>
          <path d="M22 42 Q32 48 42 42" stroke="#050b10" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="lock-reticle"></div>
      </div>
      <span class="callsign">Workshop Division // Tool</span>
      <div class="nav-links">
        <a href="https://projects.slippylabs.com/" class="logout-link">← Archive</a>
      </div>
    </div>

    <h1>JSON FORMATTER</h1>
    <p class="subtitle">Paste JSON below. Format cleans it up, Minify strips it down, and any syntax error is called out immediately.</p>

    <div class="tool-field-row">
      <label class="tool-field-label" for="json-input">Input JSON</label>
      <textarea class="tool-textarea" id="json-input" spellcheck="false" placeholder='{"callsign": "Slippy", "team": "Far Fox", "ready": true}'></textarea>
    </div>

    <div class="tool-controls">
      <button class="tool-btn" id="format-btn">Format</button>
      <button class="tool-btn" id="minify-btn">Minify</button>
      <button class="tool-btn ghost" id="copy-btn">Copy Output</button>
      <span class="copy-toast" id="copy-toast">Copied!</span>
    </div>

    <div class="tool-field-row">
      <label class="tool-field-label" for="json-output">Output</label>
      <pre class="tool-output" id="json-output">Waiting for input…</pre>
    </div>

    <div class="comm-window">
      <div class="comm-portrait">
        <svg width="36" height="36" viewBox="0 0 64 64">
          <circle cx="32" cy="34" r="22" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="44" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="3.5" fill="#050b10"/>
          <circle cx="44" cy="16" r="3.5" fill="#050b10"/>
          <ellipse cx="24" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>
          <ellipse cx="40" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>
          <circle cx="24" cy="30" r="1.4" fill="#39ff8f"/>
          <circle cx="40" cy="30" r="1.4" fill="#39ff8f"/>
          <path d="M22 42 Q32 48 42 42" stroke="#050b10" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="comm-body">
        <div class="comm-label"><span class="dot"></span> Incoming Transmission &mdash; Slippy</div>
        <p>"Nothing you paste here ever leaves this tab."</p>
      </div>
    </div>

    <a href="https://projects.slippylabs.com/" class="hud-btn">← Back to Archive</a>
  </div>
</main>

<script>
const input = document.getElementById('json-input');
const output = document.getElementById('json-output');
const copyToast = document.getElementById('copy-toast');

function showResult(text, isError) {
  output.textContent = text;
  output.classList.toggle('error-text', !!isError);
}

function parseInput() {
  const raw = input.value.trim();
  if (!raw) throw new Error('Input is empty.');
  return JSON.parse(raw);
}

document.getElementById('format-btn').addEventListener('click', () => {
  try {
    const data = parseInput();
    showResult(JSON.stringify(data, null, 2), false);
  } catch (err) {
    showResult('Invalid JSON: ' + err.message, true);
  }
});

document.getElementById('minify-btn').addEventListener('click', () => {
  try {
    const data = parseInput();
    showResult(JSON.stringify(data), false);
  } catch (err) {
    showResult('Invalid JSON: ' + err.message, true);
  }
});

document.getElementById('copy-btn').addEventListener('click', async () => {
  const text = output.textContent;
  if (!text || output.classList.contains('error-text')) return;
  try {
    await navigator.clipboard.writeText(text);
    copyToast.classList.add('show');
    setTimeout(() => copyToast.classList.remove('show'), 1400);
  } catch (err) {
    showResult('Could not copy: clipboard access was denied.', true);
  }
});
</script>
</body>
</html>
